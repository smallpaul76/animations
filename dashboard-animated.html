<script>
(function () {

  function easeOut(t)   { return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) { return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
  function getEl(id)    { return document.getElementById(id); }
  function fmtComma(n)  { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  var COUNTS = [
    ['num-emails-headline', 10200, 'comma',  0  ],
    ['num-emails-delta',      888, 'plain',  0  ],
    ['num-msgs-headline',   10543, 'comma', 100 ],
    ['num-msgs-delta',        463, 'plain', 100 ],
    ['num-ep-pct-1', 100, 'pct',   0], ['num-ep-pct-2',  95, 'pct',   60],
    ['num-ep-pct-3',  36, 'pct', 120], ['num-ep-pct-4',  15, 'pct',  180],
    ['num-ep-pct-5',   1, 'pct', 240],
    ['num-ep-sub-1', 9778, 'plain',   0], ['num-ep-sub-2', 9299, 'plain',  60],
    ['num-ep-sub-3', 3472, 'plain', 120], ['num-ep-sub-4', 1510, 'plain', 180],
    ['num-ep-sub-5',   89, 'plain', 240],
    ['num-mp-pct-1', 100, 'pct', 100], ['num-mp-pct-2',  95, 'pct', 160],
    ['num-mp-pct-3',  36, 'pct', 220], ['num-mp-pct-4',  15, 'pct', 280],
    ['num-mp-pct-5',   1, 'pct', 340],
    ['num-mp-sub-1', 9778, 'plain', 100], ['num-mp-sub-2', 9299, 'plain', 160],
    ['num-mp-sub-3', 3472, 'plain', 220], ['num-mp-sub-4', 1510, 'plain', 280],
    ['num-mp-sub-5',   89, 'plain', 340],
  ];

  var EMAIL_BARS = [
    ['cr-Rectangle_340', 155.62, 344.27,   0], ['cr-Rectangle_336', 155.62, 344.27,  60],
    ['cr-Rectangle_341', 143.17, 344.27,  60], ['cr-Rectangle_337', 148.70, 344.27, 120],
    ['cr-Rectangle_342',  49.80, 344.27, 120], ['cr-Rectangle_338',  53.95, 344.27, 180],
    ['cr-Rectangle_343',  17.98, 344.27, 180], ['cr-Rectangle_339',  74.00, 344.27, 240],
    ['cr-Rectangle_344',   2.77, 344.27, 240],
  ];
  var MSG_BARS = [
    ['cr-Rectangle_340-2', 155.62, 681.04, 100], ['cr-Rectangle_336-2', 155.62, 681.04, 160],
    ['cr-Rectangle_341-2', 143.17, 681.04, 160], ['cr-Rectangle_337-2', 148.70, 681.04, 160],
    ['cr-Rectangle_342-4',  49.80, 681.04, 220], ['cr-Rectangle_338-2',  53.95, 681.04, 220],
    ['cr-Rectangle_343-2',  17.98, 681.04, 280], ['cr-Rectangle_339-2',  74.00, 681.04, 280],
    ['cr-Rectangle_344-2',   2.77, 681.04, 340],
  ];
  var SUMMARY_BARS = [
    ['cr-Rectangle_342-3', 45.84, 685.88,   0],
    ['cr-Rectangle_342-2', 79.81, 685.88, 100],
  ];

  var BAR_DUR=900, LINE_DUR=1100, COUNT_DUR=1000, DOT_DELAY=900;
  var timers=[], hasPlayed=false;

  function reset() {
    hasPlayed=false;
    [].concat(EMAIL_BARS,MSG_BARS,SUMMARY_BARS).forEach(function(b){
      var cr=getEl(b[0]); if(!cr) return;
      cr.setAttribute('height','0'); cr.setAttribute('y',String(b[2]));
    });
    ['Path_897','Path_897-2','Path_897-3','Path_45'].forEach(function(pid){
      var el=getEl(pid); if(el) el.setAttribute('stroke-dashoffset','1');
    });
    var fill=getEl('Path_44'); if(fill) fill.style.opacity='0';
    ['Ellipse_58','Ellipse_59','Ellipse_60','Ellipse_61','Ellipse_62',
     'Ellipse_58-2','Ellipse_59-2','Ellipse_60-2','Ellipse_61-2','Ellipse_62-2',
     'Ellipse_58-3','Ellipse_60-3','Ellipse_61-3','Ellipse_62-3','Ellipse_63'].forEach(function(id){
      var el=getEl(id); if(el){if(el._anim){try{el._anim.cancel();}catch(e){}} el.style.opacity='0';}
    });
    COUNTS.forEach(function(c){
      var el=getEl(c[0]); if(!el) return;
      var ts=el.querySelector('tspan'); if(!ts) return;
      ts.textContent=c[2]==='pct'?'0%':'0';
    });
  }

  function animateBar(b) {
    timers.push(setTimeout(function(){
      var cr=getEl(b[0]); if(!cr) return;
      var finalH=b[1], bottomY=b[2], start=null;
      (function tick(ts){
        if(!start) start=ts;
        var t=Math.min((ts-start)/BAR_DUR,1), e=easeOut(t), h=e*finalH;
        cr.setAttribute('height',String(h)); cr.setAttribute('y',String(bottomY-h));
        if(t<1) requestAnimationFrame(tick);
        else{cr.setAttribute('height',String(finalH));cr.setAttribute('y',String(bottomY-finalH));}
      })(performance.now());
    },b[3]));
  }

  function animateLine(pid,delay){
    timers.push(setTimeout(function(){
      var el=getEl(pid); if(!el) return; var start=null;
      (function tick(ts){
        if(!start) start=ts;
        var t=Math.min((ts-start)/LINE_DUR,1);
        el.setAttribute('stroke-dashoffset',String(1-easeInOut(t)));
        if(t<1) requestAnimationFrame(tick); else el.setAttribute('stroke-dashoffset','0');
      })(performance.now());
    },delay));
  }

  function fadeIn(id,delay){
    timers.push(setTimeout(function(){
      var el=getEl(id); if(!el) return;
      el._anim=el.animate([{opacity:0},{opacity:1}],{duration:400,easing:'ease',fill:'forwards'});
    },delay));
  }

  function animateCount(c){
    timers.push(setTimeout(function(){
      var el=getEl(c[0]); if(!el) return;
      var ts=el.querySelector('tspan'); if(!ts) return;
      var final=c[1], fmt=c[2], start=null;
      (function tick(now){
        if(!start) start=now;
        var t=Math.min((now-start)/COUNT_DUR,1), val=easeOut(t)*final;
        if(fmt==='pct')        ts.textContent=Math.round(val)+'%';
        else if(fmt==='comma') ts.textContent=fmtComma(val);
        else                   ts.textContent=String(Math.round(val));
        if(t<1) requestAnimationFrame(tick);
        else{
          if(fmt==='pct')        ts.textContent=final+'%';
          else if(fmt==='comma') ts.textContent=fmtComma(final);
          else                   ts.textContent=String(final);
        }
      })(performance.now());
    },c[3]));
  }

  function clearTimers(){timers.forEach(clearTimeout);timers=[];}

  function runAll(){
    if(hasPlayed) return; hasPlayed=true; clearTimers();
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      EMAIL_BARS.forEach(animateBar); MSG_BARS.forEach(animateBar); SUMMARY_BARS.forEach(animateBar);
      animateLine('Path_897',0); animateLine('Path_897-2',100);
      animateLine('Path_897-3',200); animateLine('Path_45',0);
      timers.push(setTimeout(function(){
        var el=getEl('Path_44');
        if(el) el.animate([{opacity:0},{opacity:1}],{duration:800,easing:'ease',fill:'forwards'});
      },200));
      ['Ellipse_58','Ellipse_59','Ellipse_60','Ellipse_61','Ellipse_62'].forEach(function(id,i){
        fadeIn(id, DOT_DELAY + i*60);
      });
      ['Ellipse_58-2','Ellipse_59-2','Ellipse_60-2','Ellipse_61-2','Ellipse_62-2'].forEach(function(id,i){
        fadeIn(id, DOT_DELAY + 100 + i*60);
      });
      ['Ellipse_58-3','Ellipse_60-3','Ellipse_61-3','Ellipse_62-3','Ellipse_63'].forEach(function(id,i){
        fadeIn(id, DOT_DELAY + 200 + i*60);
      });
      COUNTS.forEach(animateCount);
    });});
  }

  function checkInView(){
    var wrap=document.querySelector('.dash-wrap'); if(!wrap||hasPlayed) return;
    var rect=wrap.getBoundingClientRect(), winH=window.innerHeight||document.documentElement.clientHeight;
    if(rect.top<winH*0.92&&rect.bottom>winH*0.08) runAll();
  }

  function init(){
    reset(); var wrap=document.querySelector('.dash-wrap'); if(!wrap) return;
    if(window.IntersectionObserver){
      var ff=true;
      new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if(e.isIntersecting){clearTimers();if(!ff)reset();ff=false;timers.push(setTimeout(runAll,50));}
          else if(!ff){clearTimers();reset();} ff=false;
        });
      },{threshold:0.10}).observe(wrap);
    }
    var onS=function(){checkInView();};
    window.addEventListener('scroll',onS,{passive:true}); window.addEventListener('resize',onS,{passive:true});
    try{if(window.parent&&window.parent!==window)window.parent.addEventListener('scroll',onS,{passive:true});}catch(e){}
    setTimeout(checkInView,200); setTimeout(checkInView,600); setTimeout(checkInView,1200);
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
